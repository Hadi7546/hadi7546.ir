<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#232221" />
        <meta name="description" content="My recent activities and stats." />
        <meta
            name="keywords"
            content="Hadi, Azarnasab, activities, music, coding, typing"
        />
        <meta name="author" content="Hadi Azarnasab" />
        <meta name="robots" content="index, follow" />
        <meta property="og:title" content="Activities" />
        <meta
            property="og:description"
            content="Recent activities and stats."
        />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://hadi7546.ir/activities" />
        <meta
            property="og:image"
            content="https://hadi7546.ir/public/images/pixelated-hadi-rmbg.png"
        />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="Activities" />
        <meta
            name="twitter:description"
            content="Recent activities and stats."
        />
        <meta
            name="twitter:image"
            content="https://hadi7546.ir/public/images/pixelated-hadi-rmbg.png"
        />
        <title>Activities</title>
        <link
            rel="icon"
            type="image/png"
            href="/public/images/pixelated-hadi-rmbg.png"
        />
        <link
            rel="shortcut icon"
            type="image/png"
            href="/public/images/pixelated-hadi-rmbg.png"
        />
        <link rel="stylesheet" href="/style.css" />
        <link rel="stylesheet" href="/cursor.css" />
    </head>
    <body>
        <div class="container">
            <div class="fc-hazard" aria-hidden="true"></div>

            <div class="page-header">
                <h1 class="page-title">Activities</h1>
                <div class="fc-drag-handle" aria-hidden="true"></div>
            </div>

            <div class="fc-separator" aria-hidden="true"></div>

            <nav class="fc-tabs">
                <a class="fc-tab" href="/">Home</a>
                <a class="fc-tab" href="/activities" aria-current="page"
                    >Activities</a
                >
                <a class="fc-tab" href="/blog">Blog</a>
            </nav>

            <div class="header-section">
                <div class="name-intro">
                    <p>
                        Here you can see my recent activities including music
                        I'm listening to, code commits, and typing test results.
                        These are automatically updated from various platforms I
                        use.
                    </p>
                </div>
            </div>

            <div class="activity-section">
                <div class="fc-subheader activity-header fc-i-speaker">
                    <b>Last played:</b>
                </div>
                <div id="lastfm-track" class="lastfm-track">
                    <div class="loading">Loading...</div>
                    <div class="fc-bar fc-bar--busy"><div class="fc-bar-fill"></div></div>
                </div>
            </div>

            <div class="activity-section">
                <div class="fc-subheader activity-header fc-i-gear">
                    <b>Last commit:</b>
                </div>
                <div id="github-commit" class="github-commit">
                    <div class="loading">Loading...</div>
                    <div class="fc-bar fc-bar--busy"><div class="fc-bar-fill"></div></div>
                </div>
            </div>

            <div class="activity-section">
                <div class="fc-subheader activity-header fc-i-science">
                    <b>Last typing test:</b>
                </div>
                <div id="monkeytype-test" class="monkeytype-test">
                    <div class="loading">Loading...</div>
                    <div class="fc-bar fc-bar--busy"><div class="fc-bar-fill"></div></div>
                </div>
            </div>

            <div class="fc-belt" aria-hidden="true"></div>
        </div>

        <div class="fc-quickbar">
            <div
                class="fc-quickbar-slot fc-i-plate"
                data-count="100"
                data-tip="Iron plate"
            ></div>
            <div
                class="fc-quickbar-slot fc-i-copper"
                data-count="100"
                data-tip="Copper plate"
            ></div>
            <div
                class="fc-quickbar-slot fc-i-gear"
                data-count="50"
                data-tip="Iron gear wheel"
            ></div>
            <div
                class="fc-quickbar-slot fc-i-belt"
                data-count="200"
                data-tip="Transport belt"
            ></div>
            <div
                class="fc-quickbar-slot fc-i-machine"
                data-count="12"
                data-tip="Assembling machine"
            ></div>
            <div
                class="fc-quickbar-slot fc-i-chest"
                data-count="20"
                data-tip="Wooden chest"
            ></div>
            <div
                class="fc-quickbar-slot fc-i-science"
                data-count="75"
                data-tip="Automation science pack"
            ></div>
            <div
                class="fc-quickbar-slot fc-i-radar"
                data-count="4"
                data-tip="Radar"
            ></div>
            <div
                class="fc-quickbar-slot fc-i-lamp"
                data-count="40"
                data-tip="Small lamp"
            ></div>
            <div class="fc-quickbar-slot"></div>
        </div>

        <script src="/script.js"></script>
    </body>
</html>
